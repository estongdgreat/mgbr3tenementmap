        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

            /* Loading overlay styles */
            #loading-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: white;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                flex-direction: column;
                z-index: 9999;
            }

            .loading-text {
                font-size: 18px;
                font-weight: bold;
                margin: 5px 0;
                color: #333;
            }

            /* Spinner Animation */
            .spinner {
                width: 50px;
                height: 50px;
                border: 6px solid #ddd;
                border-top: 6px solid #007bff;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
}

        /* Map container */
        #map {
            height: 100%;
        }

        /* Modern Popup Design */
        .leaflet-popup-content-wrapper {
            padding: 0;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        .leaflet-popup-content {
            margin: 0 !important;
            width: 340px !important;
        }
        .popup-header {
            background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%);
            color: white;
            padding: 16px !important;
        }
        .popup-body {
            padding: 12px 16px !important;
            background: #fff;
        }
        .popup-field-row:last-child {
            border-bottom: none !important;
            padding-bottom: 4px;
        }

        /* Compact Colatilla / Abstract Styles */
        .abstractUncollapsed {
            max-width: 280px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(0,0,0,0.1);
            font-size: 11px;
            transition: all 0.3s ease;
            cursor: help;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .abstractUncollapsed ol {
            margin: 5px 0 0 18px;
            padding: 0;
            display: none; /* Hide list by default */
        }
        .abstractUncollapsed:hover ol {
            display: block; /* Show list on hover */
        }

        /* Center Title Repositioning */
        .map-title-control {
            position: fixed !important;
            left: 50%;
            transform: translateX(-50%);
            top: 10px;
            margin: 0 !important;
            z-index: 1000;
            white-space: nowrap;
        }

        // Initialize map immediately

            initializeMap();

        // Hide loading screen when window is ready

            // Small timeout to ensure the user sees the logo/branding briefly
            setTimeout(() => {
                document.getElementById('loading-overlay').style.transition = 'opacity 0.5s';
                document.getElementById('loading-overlay').style.opacity = '0';
                setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 500);
            }, 2000);
        });


    function initializeMap() {
            var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: '#ffff00',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: '#ffff00',
                fillOpacity: 1
              });
            }
        }

            zoomControl:false, maxZoom:28, minZoom:1

        map.attributionControl.setPrefix(' Developed using Leaflet | MGB Region 3 | Mine Management Division | Survey Section ');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

                //Title
                var title = new L.Control();
            title.onAdd = function (map) {
                this._div = L.DomUtil.create('div', 'map-title-control');
                this.update();
                return this._div;
            };

            title.update = function () {
                this._div.innerHTML = `
                    <div class="d-flex align-items-center bg-white p-2 rounded shadow-sm border">
                        <img src="images/mgblogo.png" width="40" height="40" class="me-2" alt="Logo">
                        <div>
                            <h6 class="mb-0 fw-bold">REGION 3 MINING TENEMENT CONTROL MAP</h6>
                            <small class="text-muted text-uppercase">Data as of March 2026</small>
                        </div>
                    </div>`;
            };

            title.addTo(map);


        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}

        // Modernized Reusable Popup Generator
        function generatePopupContent(feature) {
            const fieldLabels = {
                'Seq': 'Sequence',
                'Tenement_N': 'Permit Number',
                'Parcel': 'Parcel',
                'Tene_Type': 'Tenement Type',
                'Holder': 'Holder / Company',
                'Area': 'Area (Hectares)',
                'Municipali': 'Municipality',
                'Province': 'Province',
                'Region': 'Region',
                'Commodity': 'Commodity'
            };

            const title = feature.properties['Tenement_N'] || 'Tenement Details';
            const subtitle = feature.properties['Holder'] || 'Information Summary';

            let bodyRows = '';
            Object.entries(fieldLabels).forEach(([key, label]) => {
                const val = feature.properties[key];
                if (val !== null && val !== undefined && String(val).trim() !== "") {
                    const linkedVal = autolinker.link(String(val).toLocaleString());
                    bodyRows += `
                        <div class="row gx-0 py-2 border-bottom popup-field-row align-items-center">
                            <div class="col-5">
                                <span class="text-muted fw-bold text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.03em;">${label}</span>
                            </div>
                            <div class="col-7 text-end">
                                <span class="fw-bold text-dark" style="font-size: 0.95rem;">${linkedVal}</span>
                            </div>
                        </div>`;
                }
            });

            return `
                <div class="modern-popup">
                    <div class="popup-header">
                        <h6 class="mb-1 fw-bold" style="font-size: 1.05rem;">${title}</h6>
                        <div class="opacity-75 fw-light" style="font-size: 0.82rem;">${subtitle}</div>
                    </div>
                    <div class="popup-body">
                        <div class="container-fluid p-0">
                            ${bodyRows || '<div class="text-center py-2 text-muted fst-italic">No permit data found</div>'}
                        </div>
                    </div>
                </div>`;
        }

        function handleLayerEvents(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var content = generatePopupContent(feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 450, minWidth: 320 });
        }

		document.addEventListener("DOMContentLoaded", function() {
            // set new Layers List height which considers toggle icon
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height 
                        || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = true;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            // toggle Collapsed/Expanded and apply new Layers List height
            toggleLayerControl.addEventListener('click', function() {
                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight()
            });	
			// apply new Layers List height if toggle layerstree
			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) {
						newLayersListHeight();
					}
				});
			}
            // Collapsed/Expanded at Start to apply new height
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            // Collapsed touch/small screen
            var isSmallScreen = window.innerWidth < 650;
            if (isSmallScreen) {
                setTimeout(function() {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                    isLayersListExpanded = !isLayersListExpanded;
                }, 500);
            }  
        });       
        setBounds();



        //colatilla
            var abstract = new L.Control({'position':'bottomleft'});
            abstract.onAdd = function (map) {
                this._div = L.DomUtil.create('div',
                'leaflet-control abstract');
                this._div.id = 'abstract'

                    abstract.show();
                    return this._div;
                };
                abstract.show = function () {
                    this._div.classList.remove("abstract");
                    this._div.classList.add("abstractUncollapsed");
                    this._div.innerHTML = `
                        <b class="text-danger" style="font-size: 10px; letter-spacing: 0.5px;">
                            <i class="fas fa-info-circle me-1"></i> COLATTILLA (Hover for Disclaimer)
                        </b>
                        <ol class="text-muted">
                            <li>Political Boundaries are not indicative</li>
                            <li>Map data are based on Survey Section Records.</li>
                            <li>This Map is not valid for litigation purposes.</li>
                            <li>Preplotted applications are not indicated in the map.</li>
                        </ol>`;
            };
            abstract.addTo(map);

            //North Arrow
            var north = L.control({position: "bottomleft"});
                    north.onAdd = function(map) {
                        var div = L.DomUtil.create("div", "info legend");
                        div.innerHTML = '<img src="images/north-arrow-n.svg" width="50" height="60">';
                        return div;
                    }
                    north.addTo(map);

            L.control.scale({position: "bottomleft"}).addTo(map);


            //coordinates display
            var coordDisplay = L.control({ position: 'bottomleft' });
            coordDisplay.onAdd = function (map) {
                this._div = L.DomUtil.create('div', 'leaflet-control-latlon');
                this._div.style.padding = "5px";
                this._div.style.background = "rgba(255, 255, 255, 0.7)";
                this._div.style.borderRadius = "4px";
                this._div.style.fontSize = "14px";
                this.update();
                return this._div;
            };

            coordDisplay.update = function (latlng) {
                this._div.innerHTML = latlng ? `Lat: ${latlng.lat.toFixed(5)}, Long: ${latlng.lng.toFixed(5)}` : 'Move cursor over the map';
            };

            coordDisplay.addTo(map);

            // Update coordinates on mouse move
            map.on('mousemove', function (e) {
                coordDisplay.update(e.latlng);
            });
        }
